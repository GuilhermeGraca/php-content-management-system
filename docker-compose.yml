services:
  web:
    image: php:8.1-apache
    container_name: smi-php-cms-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=bd_soundcloud_pt
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: smi-php-cms-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bd_soundcloud_pt
    volumes:
      - db_data:/var/lib/mysql
      - ./database/base_dados.sql:/docker-entrypoint-initdb.d/base_dados.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smi-php-cms-pma
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - db

volumes:
  db_data:
